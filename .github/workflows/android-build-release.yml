name: Android Build & Release

# Builds the Wear OS app (and the companion phone app) on every push / PR, and turns a version tag
# into a GitHub Release with the signed APKs attached.
#
#   push a tag  v5.0.0  ->  builds with versionName 5.0.0 and publishes a Release
#
# See the "Publish release" step for the release text.

on:
  push:
    branches: [ master, main, dev ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main, dev ]
  workflow_dispatch:

# Needed so the release job may create Releases with the default GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK that the GitHub-hosted runner already ships with instead of
      # android-actions/setup-android, which currently fails on the Node 24 runners.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0" "platform-tools"
          echo "----- installed -----"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
          else
            VERSION="$(grep -oE 'versionName[^"]*"[^"]+"' wear/build.gradle | head -1 | sed -E 's/.*"([^"]+)"/\1/')"
            VERSION="${VERSION:-0.0}-dev.${GITHUB_RUN_NUMBER}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (release=$IS_RELEASE)"

      - name: Build debug and release APKs
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionNameOverride="${{ steps.version.outputs.version }}" \
            -PversionCodeOverride="${{ github.run_number }}" \
            :wear:assembleDebug \
            :wear:assembleRelease \
            :mobile:assembleDebug \
            :mobile:assembleRelease

      - name: Run unit tests
        run: ./gradlew --no-daemon :mobile:testDebugUnitTest || true

      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          cp wear/build/outputs/apk/release/wear-release.apk      "artifacts/permanentproxy-wear-${VERSION}.apk"
          cp wear/build/outputs/apk/debug/wear-debug.apk          "artifacts/permanentproxy-wear-${VERSION}-debug.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk  "artifacts/permanentproxy-mobile-${VERSION}.apk"
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Check the APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "artifacts/permanentproxy-wear-${{ steps.version.outputs.version }}.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: permanentproxy-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags, needed to build the changelog against the previous release.
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"

          # The commit subjects since the previous version tag, written to a file so that
          # backticks or $ in a commit message can never be interpreted by the shell.
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "v${VERSION}" | head -1 || true)"
          if [ -n "$PREV_TAG" ]; then
            echo "Writing the changelog since ${PREV_TAG}"
            git log --no-merges --pretty='- %s' "${PREV_TAG}..HEAD" > changelog.txt
            RANGE_HEADING="Changes since ${PREV_TAG}"
          else
            echo "No previous version tag found, listing the most recent commits"
            git log --no-merges --pretty='- %s' -20 HEAD > changelog.txt
            RANGE_HEADING="What is in this release"
          fi
          if [ ! -s changelog.txt ]; then
            echo "- Maintenance release, no user visible changes." > changelog.txt
          fi
          echo "----- changelog -----"
          cat changelog.txt

          # Splice the changelog into the template. Template variables are replaced by awk, so the
          # text itself needs no shell escaping (it contains backticks, $ and | characters).
          awk -v ver="${VERSION}" -v heading="${RANGE_HEADING}" '
            /@CHANGELOG@/ {
              while ((getline line < "changelog.txt") > 0) print line
              close("changelog.txt")
              next
            }
            { gsub(/@VERSION@/, ver); gsub(/@RANGE_HEADING@/, heading); print }
          ' .github/release-notes-template.md > RELEASE_NOTES.md

          echo "----- release notes -----"
          cat RELEASE_NOTES.md


      # softprops/action-gh-release@v2 currently fails on the Node 24 runners, so the Release is
      # created through the REST API with curl instead. No Node, no third-party action.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          UPLOAD="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28")

          # v5.0.1-beta.1 -> pre-release, v5.0.1 -> full release
          PRERELEASE=false
          case "$TAG" in *-*) PRERELEASE=true ;; esac

          jq -n --arg tag "$TAG" \
                --arg name "Permanent Proxy ${VERSION}" \
                --rawfile body RELEASE_NOTES.md \
                --argjson pre "$PRERELEASE" \
             '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:$pre}' > release.json

          echo "Creating the release for ${TAG} (prerelease=${PRERELEASE})"
          CODE="$(curl -sS -o release_response.json -w '%{http_code}' \
                   -X POST "${AUTH[@]}" "${API}/releases" --data-binary @release.json)"

          if [ "$CODE" = "422" ]; then
            # A release for this tag already exists (workflow re-run); reuse it.
            echo "A release for ${TAG} already exists, reusing it."
            CODE="$(curl -sS -o release_response.json -w '%{http_code}' \
                     "${AUTH[@]}" "${API}/releases/tags/${TAG}")"
          fi

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error title=Release creation failed (HTTP ${CODE})::$(head -c 900 release_response.json)"
            exit 1
          fi

          RELEASE_ID="$(jq -r '.id' release_response.json)"
          echo "Release id: ${RELEASE_ID}"
          echo "Release url: $(jq -r '.html_url' release_response.json)"

          # Attach the APKs and SHA256SUMS.txt, replacing same-named assets on a re-run.
          for file in artifacts/*; do
            asset="$(basename "$file")"
            existing="$(curl -sS "${AUTH[@]}" "${API}/releases/${RELEASE_ID}/assets" \
                        | jq -r --arg n "$asset" '.[] | select(.name == $n) | .id' | head -1)"
            if [ -n "$existing" ]; then
              echo "Replacing the existing asset ${asset} (id ${existing})"
              curl -sS -X DELETE "${AUTH[@]}" "${API}/releases/assets/${existing}" > /dev/null
            fi

            echo "Uploading ${asset} ($(du -h "$file" | cut -f1))"
            CODE="$(curl -sS -o asset_response.json -w '%{http_code}' \
                     -X POST "${AUTH[@]}" -H "Content-Type: application/octet-stream" \
                     --data-binary @"$file" "${UPLOAD}/releases/${RELEASE_ID}/assets?name=${asset}")"
            if [ "$CODE" != "201" ]; then
              echo "::error title=Uploading ${asset} failed (HTTP ${CODE})::$(head -c 900 asset_response.json)"
              exit 1
            fi
            echo "  -> $(jq -r '.browser_download_url' asset_response.json)"
          done

          echo "Release published: $(jq -r '.html_url' release_response.json)"
