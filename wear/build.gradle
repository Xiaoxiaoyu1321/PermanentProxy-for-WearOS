plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'nl.jolanrensen.permanentproxy'
    compileSdk 34
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "nl.jolanrensen.permanentproxy"
        // 24 is the minimum required by dev.rikka.shizuku:api.
        // Wear OS 2.0 (the oldest supported Wear version) is API 25, so nothing is lost.
        minSdk 24
        targetSdk 34
        // CI overrides these from the pushed tag, e.g. -PversionNameOverride=5.0.0
        versionCode(project.findProperty('versionCodeOverride')?.toString()?.toInteger() ?: 17)
        versionName(project.findProperty('versionNameOverride')?.toString() ?: "5.0.0")
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        abortOnError false
    }
}

// Adds the release signing configuration (see signing.gradle).
apply from: rootProject.file('signing.gradle')

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Wear OS UI (BoxInsetLayout, ConfirmationActivity, ...)
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    // Shizuku: lets this app run code with shell (ADB) or root identity.
    // This replaced the old "ADB over Bluetooth" implementation (com.tananaev:adblib).
    implementation "dev.rikka.shizuku:api:${rootProject.ext.shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${rootProject.ext.shizuku_version}"
}
